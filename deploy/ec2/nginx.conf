# FileVault — Nginx site config (EC2 single-box)
# Frontend: static build from /opt/filevault/app/frontend/build
# API:      proxy to PM2-managed backend on 127.0.0.1:3000
# TLS:      enable certbot below after DNS is pointed (listen 443)

server {
    listen 80;
    server_name filevault.hariomop.in _;

    # Large multipart uploads (parts stream straight to R2, but keep it generous)
    client_max_body_size 0;

    # Do not buffer; the backend streams R2 presigned responses
    proxy_request_buffering off;
    proxy_buffering off;

    # Gzip static assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Health / metrics (no auth) — scrape without exposing internals broadly
    location /metrics {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API + docs
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /api-docs {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend static build + SPA fallback
    root /opt/filevault/app/frontend/build;
    index index.html;

    location /static/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location /favicon.ico {
        expires 30d;
        log_not_found off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

